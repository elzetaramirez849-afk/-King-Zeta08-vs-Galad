<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>King Zeta08 vs Galad</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#25205a,#080914 70%);color:#fff;font-family:system-ui;text-align:center;touch-action:none;overflow:hidden}h1{font-size:24px;margin:12px 0 4px}.sub{opacity:.8;font-size:13px}.hud{display:flex;gap:8px;justify-content:center;margin:8px}.bar{width:42vw;max-width:250px;height:18px;border:2px solid #fff;border-radius:10px;overflow:hidden;background:#222}.hp{height:100%;width:100%;background:#22d36b;transition:.2s}.enemy{background:#ff4055}.arena{position:relative;height:42vh;max-height:430px;margin:8px auto;width:94vw;max-width:700px;border:2px solid #7d75ff;border-radius:20px;background:linear-gradient(#151334aa,#33245faa);overflow:hidden}.fighter{position:absolute;bottom:30px;font-size:76px;filter:drop-shadow(0 8px 8px #000);transition:.15s}.zeta{left:14%}.galad{right:14%}.vs{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-size:30px;font-weight:900}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:94vw;max-width:700px;margin:auto}.controls button,.move button{border:0;border-radius:14px;padding:14px 6px;background:#302b72;color:#fff;font-weight:800;font-size:15px;box-shadow:0 4px 0 #17143e}.controls button:active,.move button:active{transform:translateY(3px);box-shadow:none}.special{background:#a82d74!important}.block{background:#2d7ca8!important}.move{display:flex;justify-content:center;gap:8px;margin:10px}.move button{background:#41416c}.msg{min-height:24px;margin:8px;font-weight:700}.banner{position:absolute;inset:0;display:grid;place-items:center;font-size:42px;font-weight:1000;text-shadow:0 4px 12px #000;opacity:0;pointer-events:none;background:#0006;transition:.2s}.sound{position:fixed;right:10px;top:8px;border:0;border-radius:20px;padding:8px 12px;background:#292747;color:#fff}.small{font-size:11px;opacity:.65;margin-top:4px}</style></head><body><button class="sound" id="sound">🔊 Sonido ON</button><h1>👑 KING ZETA08 ⚔️ GALAD</h1><div class="sub">Versión de prueba • toca los botones para pelear</div><div class="hud"><div><b>King Zeta08</b><div class="bar"><div id="zhp" class="hp"></div></div></div><div><b>Galad</b><div class="bar"><div id="ghp" class="hp enemy"></div></div></div></div><div class="arena"><div class="fighter zeta" id="zeta">🦁</div><div class="vs">VS</div><div class="fighter galad" id="galad">🐲</div><div class="banner" id="banner"></div></div><div class="msg" id="msg">¡Que comience la pelea!</div><div class="controls"><button data-a="hit">👊 GOLPE</button><button class="special" data-a="special">🔥 ESPECIAL</button><button class="block" data-a="block">🛡️ BLOQUEO</button><button data-a="jump">⬆️ SALTO</button></div><div class="move"><button data-m="izquierda">◀️</button><button data-m="adelante">▶️</button><button data-m="atrás">◀️▶️</button></div><div class="small">Los sonidos se activan al tocar la pantalla. Galad contraataca automáticamente.</div><script>let zh=100,gh=100,over=false,blocking=false,sound=true,t=60,audio=null;const $=id=>document.getElementById(id);function beep(f,d=.08,type='sine',v=.06){if(!sound)return;audio??=new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function msg(x){$('msg').textContent=x}function attack(d,s=false){if(over)return;gh=Math.max(0,gh-d);$('ghp').style.width=gh+'%';beep(s?130:75,.13,'sawtooth',.09);msg(s?'🦁 ¡MODO LEÓN! ¡ESPECIAL! -'+d:'👊 ¡Golpe conectado! -'+d);if(gh===0){over=true;$('banner').textContent='¡VICTORIA!';$('banner').style.opacity=1;msg('👑 King Zeta08 derrotó a Galad');beep(720,.35,'sawtooth',.1)}}function enemy(){if(over)return;let d=8+Math.floor(Math.random()*10);if(blocking)d=2;zh=Math.max(0,zh-d);$('zhp').style.width=zh+'%';beep(170,.08);msg(blocking?'🛡️ ¡Bloqueo! Daño reducido':'💥 Galad atacó: -'+d);if(zh===0){over=true;$('banner').textContent='¡DERROTA!';$('banner').style.opacity=1;msg('💀 Galad ganó la pelea')}}document.querySelectorAll('[data-a]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();let a=b.dataset.a;if(a==='hit')attack(10+Math.floor(Math.random()*7));if(a==='special')attack(22+Math.floor(Math.random()*10),true);if(a==='block'){blocking=true;msg('🛡️ BLOQUEO activado');beep(330,.1,'triangle');setTimeout(()=>blocking=false,800)}if(a==='jump'){let z=$('zeta');z.style.transform='translateY(-35px)';beep(520,.1,'triangle');setTimeout(()=>z.style.transform='',320)}}));document.querySelectorAll('[data-m]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();beep(240,.035,'triangle',.02);msg('🎮 Movimiento: '+b.dataset.move)}));$('sound').addEventListener('pointerdown',()=>{sound=!sound;$('sound').textContent=sound?'🔊 Sonido ON':'🔇 Sonido OFF';if(sound)beep(520,.1,'sine')});document.body.addEventListener('pointerdown',()=>{if(audio&&audio.state==='suspended')audio.resume()});setInterval(()=>{if(!over){t--;msg('⏱️ Tiempo: '+t+' s');if(t<=0){over=true;$('banner').textContent=gh<=zh?'¡VICTORIA!':'¡DERROTA!';$('banner').style.opacity=1}}},1000);setInterval(()=>{if(!over&&Math.random()<.38)enemy()},1900);</script></body></html>
